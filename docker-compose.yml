# Serviços de apoio para desenvolvimento local.
# Subir:   docker compose up -d
# Parar:   docker compose down        (os dados continuam no volume)
# Zerar:   docker compose down -v     (APAGA os dados do banco)

services:
  db:
    image: postgres:17-alpine
    container_name: oficina-db
    restart: unless-stopped
    environment:
      # Os valores vêm do arquivo .env (que não vai para o Git). Veja .env.example.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - oficina-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oficina-db-data:
